name: Approval gate test
on:
  workflow_dispatch:
    inputs:
      only_paths:
        description: 'Comma-separated paths to import (empty = every path). Simulates "import only changed operations".'
        required: false
        default: ''

env:
  APIDOG_API_VERSION: '2024-03-28'
  PORTAL_PROJECT_ID: '1373099'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse the portal project
        env:
          P: ${{ vars.SANDBOX_PROJECT_ID }}
        run: |
          [ -n "$P" ] || { echo "SANDBOX_PROJECT_ID not set"; exit 1; }
          [ "$P" != "$PORTAL_PROJECT_ID" ] || { echo "refusing the portal project"; exit 1; }
      - name: Build artifact (the one thing both imports use)
        env:
          ONLY: ${{ inputs.only_paths }}
        run: |
          mkdir -p out
          jq --arg only "$ONLY" '
            ($only | split(",") | map(select(length>0))) as $p
            | if ($p|length)==0 then . else .paths |= with_entries(select(.key as $k | $p | any(. == $k))) end
          ' contracts/rich.json > out/rich.json
          sha256sum out/rich.json | tee out/SHA256
          {
            echo "### Build"
            echo "Operations in this build:"
            jq -r '.paths | to_entries[] | .key as $k | .value | to_entries[] | select(.key|IN("get","put","post","delete","patch")) | "- \(.key|ascii_upcase) \($k)"' out/rich.json
            echo
            echo "sha256: \`$(cut -d' ' -f1 out/SHA256)\`"
            echo
            echo "**Review before approving:** open [the Apidog project](https://app.apidog.com/project/${{ vars.SANDBOX_PROJECT_ID }}) and switch to the preview branch (id ${{ vars.SANDBOX_PREVIEW_BRANCH_ID }}), where this build is imported. Approving the publish-main job imports the same build to main."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: out/

  preview:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: contracts
          path: out
      - name: Import to the sandbox preview branch
        env:
          APIDOG_ACCESS_TOKEN: ${{ secrets.APIDOG_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SANDBOX_PROJECT_ID }}
          BRANCH_ID: ${{ vars.SANDBOX_PREVIEW_BRANCH_ID }}
        run: |
          [ -n "$BRANCH_ID" ] || { echo "No SANDBOX_PREVIEW_BRANCH_ID"; exit 1; }
          [ "$PROJECT_ID" != "$PORTAL_PROJECT_ID" ] || exit 1
          BR=$(jq -n --argjson b "$BRANCH_ID" '{targetBranchId:$b}')
          jq -n --rawfile spec out/rich.json --argjson br "$BR" '{input:$spec,options:({endpointOverwriteBehavior:"OVERWRITE_EXISTING",schemaOverwriteBehavior:"OVERWRITE_EXISTING",updateFolderOfChangedEndpoint:true}+$br)}' > payload.json
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "https://api.apidog.com/v1/projects/${PROJECT_ID}/import-openapi?locale=en-US" -H "Authorization: Bearer ${APIDOG_ACCESS_TOKEN}" -H "X-Apidog-Api-Version: ${APIDOG_API_VERSION}" -H "Content-Type: application/json" --data @payload.json)
          echo "preview import HTTP $code"; jq -c '.data.counters | {endpointCreated,endpointUpdated,endpointFailed,schemaCreated,schemaUpdated}' resp.json || cat resp.json; [ "$code" -lt 300 ]

  publish-main:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: sandbox-main-approval
      url: https://app.apidog.com/project/${{ vars.SANDBOX_PROJECT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: contracts
          path: out
      - name: Verify it is the artifact that was built
        run: sha256sum -c out/SHA256
      - name: Import to sandbox MAIN (approved)
        env:
          APIDOG_ACCESS_TOKEN: ${{ secrets.APIDOG_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SANDBOX_PROJECT_ID }}
        run: |
          [ "$PROJECT_ID" != "$PORTAL_PROJECT_ID" ] || { echo "refusing the portal project"; exit 1; }
          jq -n --rawfile spec out/rich.json '{input:$spec,options:{endpointOverwriteBehavior:"OVERWRITE_EXISTING",schemaOverwriteBehavior:"OVERWRITE_EXISTING",updateFolderOfChangedEndpoint:true}}' > payload.json
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "https://api.apidog.com/v1/projects/${PROJECT_ID}/import-openapi?locale=en-US" -H "Authorization: Bearer ${APIDOG_ACCESS_TOKEN}" -H "X-Apidog-Api-Version: ${APIDOG_API_VERSION}" -H "Content-Type: application/json" --data @payload.json)
          echo "main import HTTP $code"; jq -c '.data.counters | {endpointCreated,endpointUpdated,endpointFailed,schemaCreated,schemaUpdated}' resp.json || cat resp.json; [ "$code" -lt 300 ]
