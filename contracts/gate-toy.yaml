openapi: 3.0.3
info:
  title: Approval gate toy
  version: "1"
paths:
  /zz-approval/ping:
    get:
      summary: Ping (approval gate test)
      operationId: zzApprovalPing
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum items, rejected with 422 when below 1.
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    type: string
